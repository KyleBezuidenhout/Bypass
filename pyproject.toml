[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "captcha-bypass"
version = "1.0.0"
description = "All-in-one open-source CAPTCHA bypass: SeleniumBase stealth + optional paid solvers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "seleniumbase>=4.30.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0.0"]

[tool.setuptools.packages.find]
include = ["captcha_bypass*"]

[tool.pytest.ini_options]
# Without this, a bare `pytest` at the repo root also crawls unrelated checkouts
# under _work/ (ghidra etc.), which is slow and errors on collection.
testpaths = ["tests"]
